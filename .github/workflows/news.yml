name: Update news

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-news.mjs', '.github/workflows/news.yml']

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save fast-xml-parser@4.5.0
      - run: node scripts/fetch-news.mjs
      # The news lives on its own "data" branch so updates don't rebuild the app
      - name: Publish to data branch
        run: |
          cd out
          git init -q -b data
          git add news.json
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Update news"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
