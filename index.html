<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pit Wall</title>
<meta name="description" content="Live timing, news, standings and calendar for every Formula 1 race weekend.">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pit Wall">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app — sticky header, scrolling view, fixed bottom tab bar. Dark timing-screen first. */
:root{
  --bg:#0d1117; --surface:#161b24; --raised:#1e2531; --line:#2a3240;
  --fg:#eef1f6; --muted:#8b95a7; --accent:#ffd21f; --accent-ink:#141414;
  --live:#ff3b3b; --green:#21c45d; --purple:#b46cff; --yellow:#ffd21f; --red:#ff3b3b; --vsc:#ff9f1a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --tabbar:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f3f4f7;--surface:#ffffff;--raised:#eceef3;--line:#d9dde5;--fg:#11151c;--muted:#5d6676;--accent:#e0b400;--accent-ink:#141414;--live:#e01e1e;--green:#12924a;--purple:#8a3ee0;--yellow:#c99a00;--red:#e01e1e;--vsc:#d97a00;color-scheme:light}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 16px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:18px;height:18px;background:repeating-conic-gradient(var(--fg) 0 25%,transparent 0 50%) 0 0/9px 9px;border:1px solid var(--fg)}
.top .updated{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding-block:16px}
.view{display:flex;flex-direction:column;gap:18px}
.view[hidden]{display:none!important}
h2.sec{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--muted);margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);padding:12px 14px;line-height:1.45}
.err{font-size:13px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}

/* Weekend hero */
.weekend{padding:16px;display:flex;flex-direction:column;gap:14px}
.weekend .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.weekend h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin:4px 0 2px;text-transform:uppercase;text-wrap:balance}
.weekend .where{color:var(--muted);font-size:14px}
.countdown{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--raised);border-radius:10px}
.countdown .lbl{font-size:13px;color:var(--muted)}
.countdown .t{font-family:var(--mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.sessions{display:grid;gap:2px}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 2px;border-top:1px solid var(--line);font-size:14px}
.srow:first-child{border-top:0}
.srow .n{font-weight:600}
.srow .d{color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--live);border-color:var(--live);color:#fff}
.pill.next{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.done{opacity:.7}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}
.pill.live .dot{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* Live timing */
.livehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 14px 10px}
.livehead .title{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;line-height:1.05}
.livehead .sub{font-size:13px;color:var(--muted);width:100%}
.flag{display:flex;align-items:center;gap:10px;margin:0 14px 12px;padding:10px 12px;border-radius:10px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.flag.green{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.flag.yellow,.flag.sc{background:color-mix(in srgb,var(--yellow) 20%,transparent);color:var(--yellow)}
.flag.vsc{background:color-mix(in srgb,var(--vsc) 20%,transparent);color:var(--vsc)}
.flag.red{background:color-mix(in srgb,var(--red) 20%,transparent);color:var(--red)}
.flag.chequered{background:var(--raised);color:var(--fg)}
.flag .lap{margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--fg)}
.wx{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px}
.wx span{font-size:12px;background:var(--raised);padding:4px 8px;border-radius:8px;color:var(--muted)}
.wx b{color:var(--fg);font-weight:600}
.tower{width:100%;border-collapse:collapse}
.tower td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle;font-size:14px}
.tower tr td:first-child{padding-left:14px}
.tower tr td:last-child{padding-right:14px}
.tower .p{width:28px;font-family:var(--mono);font-weight:700;text-align:right}
.tower .bar{width:4px;padding:0}
.tower .bar i{display:block;width:4px;height:26px;border-radius:2px}
.tower .drv{min-width:0}
.tower .drv b{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.03em}
.tower .drv small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.tower .gap{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.tower .gap small{display:block;color:var(--muted);font-size:11px}
.tower .gap.fast{color:var(--purple)}
.tyre{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;border:3px solid var(--muted);color:var(--fg)}
.tyre.SOFT{border-color:#ff3b3b}.tyre.MEDIUM{border-color:#ffd21f}.tyre.HARD{border-color:#d9dde5}.tyre.INTERMEDIATE{border-color:#21c45d}.tyre.WET{border-color:#2f8cff}
.rc{display:flex;flex-direction:column}
.rc div{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:13px;line-height:1.35}
.rc div:first-child{border-top:0}
.rc time{color:var(--muted);font-family:var(--mono);font-size:12px}

/* Segmented control */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg)}

/* Standings */
.stand{display:flex;flex-direction:column}
.st{display:grid;grid-template-columns:30px 4px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.st:first-child{border-top:0}
.st .p{font-family:var(--mono);font-weight:700;text-align:right}
.st .c{width:4px;height:30px;border-radius:2px}
.st .nm{min-width:0}
.st .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .nm small{color:var(--muted);font-size:12px}
.st .meter{height:3px;background:var(--raised);border-radius:2px;margin-top:5px;overflow:hidden}
.st .meter i{display:block;height:100%;border-radius:2px}
.st .pts{text-align:right;font-family:var(--mono);font-weight:700;font-size:16px}
.st .pts small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted)}

/* News */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.news{display:flex;flex-direction:column;gap:10px}
.story{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px;padding:12px;text-decoration:none;align-items:start}
.story.noimg{grid-template-columns:1fr}
.story h3{margin:0 0 6px;font-size:16px;line-height:1.3;font-weight:600;text-wrap:pretty}
.story p{margin:0 0 8px;font-size:13px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.story .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.story .meta b{color:var(--fg);font-weight:600}
.story img{width:96px;height:72px;object-fit:cover;border-radius:8px;background:var(--raised)}

/* Calendar */
.cal{display:flex;flex-direction:column}
.rnd{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.rnd:first-child{border-top:0}
.rnd .r{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rnd b{display:block;font-weight:600}
.rnd small{color:var(--muted);font-size:12px}
.rnd .w{text-align:right;font-size:13px}
.rnd .w small{display:block}
.rnd.past{opacity:.72}
.rnd.cur{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.sprint{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent);padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:2px}

.skel{height:14px;border-radius:6px;background:var(--raised);margin:12px 14px}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabbar)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--fg)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs .livedot{position:absolute;top:10px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--live);animation:blink 1.2s infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><i aria-hidden="true"></i>Pit Wall</div>
    <div class="updated" id="updated">Loading…</div>
    <button class="iconbtn" id="refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <!-- LIVE -->
  <section class="view" id="v-live" data-view="live">
    <div class="card weekend" id="weekend"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%;height:28px"></div><div class="skel"></div></div>
    <div>
      <h2 class="sec">Live timing</h2>
      <div class="card" id="live"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    </div>
    <div>
      <h2 class="sec">Race control</h2>
      <div class="card rc" id="rc"><div class="note">Messages from race control appear here during a session.</div></div>
    </div>
  </section>

  <!-- NEWS -->
  <section class="view" id="v-news" data-view="news" hidden>
    <div class="chips" id="newsChips" role="group" aria-label="Filter by source"></div>
    <div class="news" id="news"><div class="card"><div class="skel"></div><div class="skel"></div></div></div>
  </section>

  <!-- STANDINGS -->
  <section class="view" id="v-standings" data-view="standings" hidden>
    <div class="seg" role="group" aria-label="Standings type">
      <button data-st="drivers" aria-pressed="true">Drivers</button>
      <button data-st="teams" aria-pressed="false">Teams</button>
      <button data-st="last" aria-pressed="false">Last race</button>
    </div>
    <div class="card stand" id="stand"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </section>

  <!-- CALENDAR -->
  <section class="view" id="v-calendar" data-view="calendar" hidden>
    <div class="card cal" id="cal"><div class="skel"></div><div class="skel"></div></div>
  </section>
</main>

<nav class="tabs" aria-label="Sections">
  <div class="in" role="tablist">
    <button role="tab" data-tab="live" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 13l3-3M10 2h4"/></svg>
      Live<span class="livedot" id="liveDot" hidden></span>
    </button>
    <button role="tab" data-tab="news" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>
      News
    </button>
    <button role="tab" data-tab="standings" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21V11H3v10zM15 21V4h-5v17zM21 21v-7h-5v7z"/></svg>
      Standings
    </button>
    <button role="tab" data-tab="calendar" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Calendar
    </button>
  </div>
</nav>

<script src="app.js"></script>
</body>
</html>
